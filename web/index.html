<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つむごえ v0.5</title><link rel="stylesheet" href="/style.css"><script defer src="/cg.js"></script><script defer src="/audio.js"></script><script defer src="/novel.js"></script><script defer src="/structured.js"></script>
<script defer src="/autosave.js"></script><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="#actors">つむごえ <small>v0.5</small></a><nav id="breadcrumb" aria-label="現在地"></nav><span id="saveState" role="status">読み込み中</span><button id="importOpen">JSONを取り込む</button><button id="configOpen" class="secondary">接続設定</button></header>
<aside id="unsavedNotice" class="unsaved-notice" role="status" hidden></aside><div class="shell"><aside id="sidebar" aria-label="主な移動"><h2>資産ライブラリ</h2><a href="#actors" data-nav="actors">アクター／モデル</a><a href="#voices" data-nav="voices">ボイスライブラリ</a><h2>作品</h2><a href="#works" data-nav="works">作品一覧</a><div id="workLinks"></div><p class="version">v0.5 CG生成・管理</p></aside><main id="main" tabindex="-1"></main></div><div id="message" role="status" hidden></div>
<dialog id="intake"><form method="dialog" class="dialog-head"><h2>JSONを取り込む</h2><button class="secondary">閉じる</button></form><p id="intakeTarget"></p><p class="muted">IDなしは新規追加。同じIDを指定した項目だけ更新します。表示名や作品名では上書き先を決めません。</p><label>取り込み先作品<select id="intakeWork"></select></label><div class="grid2"><label>Trackの取り込み先<select id="intakeMode"><option value="new">新しいTrackとして追加</option><option value="update">既存Trackを更新</option></select></label><label>更新するTrack<select id="intakeTrack"></select></label></div><label>JSONテキスト<textarea id="intakeText" rows="14" spellcheck="false"></textarea></label><div class="row"><button id="intakeRun">検証して取り込む</button><a class="link" href="/api/version" target="_blank">現在の版</a></div><div id="intakeResult" role="status" class="feedback"></div></dialog>
<dialog id="confirm"><h2 id="confirmTitle"></h2><div id="confirmBody"></div><label id="confirmCheckLabel" class="check-row"><input id="confirmCheck" type="checkbox">対象と影響範囲を確認しました</label><div class="row"><button id="confirmRun" class="danger">削除する</button><button id="confirmCancel" class="secondary">保持する</button></div><p id="confirmResult" class="feedback" role="status"></p></dialog>
<dialog id="config"><form method="dialog" class="dialog-head"><h2>ローカル接続設定</h2><button class="secondary">閉じる</button></form><div id="configContent"></div></dialog>
<dialog id="character"><form method="dialog" class="dialog-head"><h2 id="characterTitle">配役</h2><button class="secondary">閉じる</button></form><div id="characterContent"></div></dialog>
</body></html>
